user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format proxy_log '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" '
                         'upstream_host=$proxy_host upstream_addr=$upstream_addr';

    access_log /var/log/nginx/access.log proxy_log;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_servers {
        least_conn;
        server python-db-query:5000 max_fails=3 fail_timeout=30s;
        server backup:5000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name 192.168.50.163;

        include /etc/nginx/conf.d/my_app_common.conf;
    }

}
