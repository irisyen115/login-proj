location / {
    root /usr/share/nginx/html/src/dist;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# 提供公開圖片列表
location /images/ {
    alias /usr/share/nginx/html/images/;
    autoindex on;
}

location /downloaded_albums/ {
    alias /usr/share/nginx/html/downloaded_albums/;
    autoindex on;
}

# Mail API
location /send-mail {
    proxy_pass http://python-mail-server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_pass_request_headers on;
}

# LINE Webhook
location /api/line/  {
    rewrite ^/api/line/(.*)$ /$1 break;
    proxy_pass http://line-reply:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $host;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
}

# 上傳 API
location /api/upload/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 204;
    }

    rewrite ^/api/upload/(.*)$ /$1 break;
    proxy_pass http://google-photos:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $host;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
}

# API proxy
location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend_servers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $host;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    add_header Access-Control-Allow-Credentials "true";
    add_header Content-Security-Policy "script-src 'self' https://accounts.google.com https://apis.google.com 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
    add_header Referrer-Policy "no-referrer-when-downgrade";

    if ($request_method = OPTIONS) {
        return 204;
    }
}

# Fallback to SPA
error_page 404 =200 /index.html;
